<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Chronous | Timepiece Details</title>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@400;600;700&family=Lato:wght@300;400;600&display=swap" rel="stylesheet">
    
    <style>
        /* --- Core Theme Variables --- */
        :root { --bg-color: #0a0a0a; --surface-color: #1a1a1a; --text-main: #f4f4f4; --text-muted: #a0a0a0; --accent-gold: #c5a059; }
        * { margin: 0; padding: 0; box-sizing: border-box; }
        
        /* --- Standard Typography --- */
        body { 
            font-family: 'Lato', sans-serif; 
            font-size: 0.95rem; 
            background-color: var(--bg-color); 
            color: var(--text-main); 
            line-height: 1.6; 
        }
        h1, h2, h3, h4 { 
            font-family: 'Playfair Display', serif; 
            font-weight: 700;
            letter-spacing: 1px;
        }
        a { text-decoration: none; color: inherit; }
        
        /* --- Buttons --- */
        .btn-primary { display: inline-block; padding: 15px 30px; background: transparent; border: 1px solid var(--accent-gold); color: var(--accent-gold); text-transform: uppercase; letter-spacing: 2px; cursor: pointer; transition: 0.3s; font-size: 0.9rem; font-weight: bold; text-align: center; width: 100%; border-radius: 4px;}
        .btn-primary:hover { background: var(--accent-gold); color: var(--bg-color); }
        
        /* --- Navigation (Synced with Cart Page) --- */
        .navbar { display: flex; justify-content: space-between; align-items: center; padding: 15px 5%; background: rgba(10, 10, 10, 0.95); position: sticky; top: 0; z-index: 100; border-bottom: 1px solid #222; }
        .logo { font-family: 'Playfair Display', serif; font-size: 1.6rem; font-weight: 400; color: var(--accent-gold); letter-spacing: 2px; }
        .nav-links { list-style: none; display: flex; gap: 30px; }
        .nav-links a { font-size: 0.95rem; font-weight: 600; transition: color 0.3s; letter-spacing: 0.5px; }
        .nav-links a:hover { color: var(--accent-gold); }
        .nav-icons { display: flex; align-items: center; gap: 20px; }
        .nav-icons > a:not(.cart-link) { font-size: 0.95rem; font-weight: 600; letter-spacing: 0.5px; transition: color 0.3s; }
        .nav-icons > a:not(.cart-link):hover { color: var(--accent-gold); }
        .cart-link { background: linear-gradient(135deg, var(--accent-gold), #dfb668); color: var(--bg-color) !important; padding: 8px 18px; border-radius: 30px; font-weight: 600; font-size: 0.95rem; letter-spacing: 0.5px; display: inline-flex; align-items: center; gap: 8px; transition: all 0.3s ease; }
        .cart-link:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(197, 160, 89, 0.6); }
        .cart-badge { background: var(--bg-color); color: var(--accent-gold); padding: 2px 7px; border-radius: 50%; font-size: 0.8rem; font-weight: bold; }
        
        /* --- Mobile Menu --- */
        .hamburger { display: none; font-size: 1.5rem; cursor: pointer; color: var(--accent-gold); user-select: none; }
        @media (max-width: 768px) {
            .hamburger { display: block; order: 1; } .nav-icons { order: 2; } .logo { order: 0; }
            #nav-menu { position: absolute; top: 100%; left: 0; width: 100%; background: rgba(10, 10, 10, 0.98); border-bottom: 1px solid #333; display: none; flex-direction: column; padding: 20px 0; box-shadow: 0 10px 15px rgba(0,0,0,0.5); }
            #nav-menu.active { display: flex; } .nav-links { flex-direction: column; align-items: center; gap: 20px; }
        }

        /* --- Centered Product Page Layout --- */
        .product-page-wrapper {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: calc(100vh - 75px); /* Centers vertically accounting for navbar */
            padding: 40px 5%;
        }

        .product-presentation-box {
            width: 100%;
            max-width: 1100px;
            background: var(--surface-color);
            border: 1px solid #222;
            border-radius: 8px;
            box-shadow: 0 25px 50px rgba(0,0,0,0.5);
            padding: 40px 50px;
            position: relative;
        }
        
        .back-link {
            display: inline-flex;
            align-items: center;
            color: var(--text-muted);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 1px;
            margin-bottom: 30px;
            transition: color 0.3s;
        }
        .back-link:hover { color: var(--accent-gold); }

        .product-layout {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 50px;
            align-items: center;
        }

        /* Left Side: Image */
        .product-image-container {
            display: flex;
            justify-content: center;
            align-items: center;
        }
        .product-image-container img {
            max-width: 100%;
            max-height: 500px;
            object-fit: cover;
            border-radius: 4px;
            box-shadow: 0 10px 30px rgba(0,0,0,0.5);
        }

        /* Right Side: Product Details */
        .product-details {
            padding: 10px 0;
        }
        
        .brand-subtitle {
            color: var(--accent-gold);
            font-size: 0.85rem;
            text-transform: uppercase;
            letter-spacing: 3px;
            margin-bottom: 10px;
            font-weight: 600;
        }

        .product-title {
            font-family: 'Playfair Display', serif;
            font-size: 2.8rem;
            line-height: 1.1;
            margin-bottom: 15px;
            color: var(--text-main);
        }

        .product-price {
            font-family: 'Playfair Display', serif;
            font-size: 1.8rem;
            color: var(--accent-gold);
            margin-bottom: 25px;
            font-weight: 700;
        }

        .product-description {
            font-size: 1.05rem;
            color: var(--text-muted);
            line-height: 1.8;
            margin-bottom: 35px;
        }

        /* Technical Specs */
        .specs-list {
            list-style: none;
            border-top: 1px solid #333;
            margin-bottom: 35px;
        }
        .specs-list li {
            display: flex;
            justify-content: space-between;
            padding: 12px 0;
            border-bottom: 1px solid #333;
            font-size: 0.9rem;
        }
        .specs-list .spec-label { color: var(--text-muted); }
        .specs-list .spec-value { color: var(--text-main); font-weight: 600; text-align: right;}

        /* Error State */
        .error-message {
            text-align: center;
            padding: 80px 20px;
        }
        .error-message h2 { font-size: 2.5rem; color: var(--accent-gold); margin-bottom: 20px; }

        @media (max-width: 900px) {
            .product-layout { grid-template-columns: 1fr; gap: 40px; }
            .product-presentation-box { padding: 30px 20px; }
            .product-title { font-size: 2.2rem; }
            .product-image-container img { max-height: 400px; }
        }
    </style>
</head>
<body>
    <header class="navbar">
        <div class="logo"><a href="index.html">CHRONOUS</a></div>
        <div class="hamburger" id="hamburger-menu">☰</div>
        <nav id="nav-menu">
            <ul class="nav-links">
                <li><a href="index.html">Home</a></li>
                <li><a href="about.html">About</a></li>
                <li><a href="collection.html">Collection</a></li>
                <li><a href="brands.html">Brands</a></li>
                <li><a href="contact.html">Contact Us</a></li>
            </ul>
        </nav>
        <div class="nav-icons">
            <a href="profile.html"><span>Profile</span></a>
            <a href="cart.html" class="cart-link">
                Cart <span class="cart-badge">0</span>
            </a>
        </div>
    </header>

    <main class="product-page-wrapper">
        <div class="product-presentation-box">
            <a href="collection.html" class="back-link">← Back to Collection</a>

            <div id="product-container">
                </div>
        </div>
    </main>

    <script>
        // 1. Exact local image array from collection.html
        const watches = [
            { id: 1, name: "Chronous Apex", price: 1250, gender: "men", desc: "Automatic movement, sapphire crystal.", image: "watch2.jpg" },
            { id: 2, name: "Starlight Chrono", price: 850, gender: "women", desc: "Quartz precision with a midnight dial.", image: "watch5.jpg" },
            { id: 3, name: "Deep Sea Diver", price: 1400, gender: "men", desc: "Water resistant to 300m, luminescent hands.", image: "watch3.jpg" },
            { id: 4, name: "Heritage Gold", price: 2100, gender: "women", desc: "18k gold plated, vintage aesthetic.", image: "watch4.jpg" },
            { id: 5, name: "Obsidian Skeleton", price: 3200, gender: "men", desc: "Exposed automatic movement, titanium case.", image: "watch6.jpg" },
            { id: 6, name: "Lunar Phase", price: 1850, gender: "women", desc: "Moonphase complication, genuine leather strap.", image: "watch7.jpg" },
            { id: 7, name: "Velocity Racing", price: 950, gender: "men", desc: "Tachymeter bezel, perforated rubber strap.", image: "watch8.jpg" },
            { id: 8, name: "Minimalist Rose", price: 650, gender: "women", desc: "Ultra-thin profile, rose gold finish.", image: "watch9.jpg" },
            { id: 9, name: "Aviation Pro", price: 1100, gender: "men", desc: "Pilot's watch with slide rule bezel.", image: "watch10.jpg" },
            { id: 10, name: "Sapphire Tourbillon", price: 8500, gender: "unisex", desc: "Hand-wound tourbillon, limited edition.", image: "watch11.jpg" }
        ];

        // 2. Cart Logic (Static Badge 0, but local storage still works)
        let cart = JSON.parse(localStorage.getItem('chronous_cart')) || [];
        function saveCart() { localStorage.setItem('chronous_cart', JSON.stringify(cart)); }
        
        function addToCart(id) { 
            const watch = watches.find(w => w.id === id); 
            if(watch) { 
                cart.push(watch); 
                saveCart(); 
                alert(`${watch.name} has been securely added to your cart.`); 
            } 
        }

        // 3. Load Product Details based on URL parameter
        document.addEventListener('DOMContentLoaded', () => {
            // Get ID from URL (e.g., product.html?id=3)
            const urlParams = new URLSearchParams(window.location.search);
            const productId = parseInt(urlParams.get('id'));
            
            const container = document.getElementById('product-container');
            const watch = watches.find(w => w.id === productId);

            // If watch is found, render the luxurious centered layout
            if (watch) {
                // Determine gender label for specs
                let categoryLabel = "Men's Collection";
                if(watch.gender === 'women') categoryLabel = "Women's Collection";
                if(watch.gender === 'unisex') categoryLabel = "Unisex Edition";

                container.innerHTML = `
                    <div class="product-layout">
                        <div class="product-image-container">
                            <img src="${watch.image}" alt="${watch.name}">
                        </div>

                        <div class="product-details">
                            <div class="brand-subtitle">Chronous Exclusive</div>
                            <h1 class="product-title">${watch.name}</h1>
                            <div class="product-price">$${watch.price.toLocaleString()}</div>
                            
                            <p class="product-description">${watch.desc} Designed for the modern connoisseur, this timepiece represents the absolute pinnacle of horological engineering and aesthetic refinement.</p>
                            
                            <ul class="specs-list">
                                <li>
                                    <span class="spec-label">Category</span>
                                    <span class="spec-value">${categoryLabel}</span>
                                </li>
                                <li>
                                    <span class="spec-label">Crystal</span>
                                    <span class="spec-value">Scratch-resistant Sapphire</span>
                                </li>
                                <li>
                                    <span class="spec-label">Water Resistance</span>
                                    <span class="spec-value">10 ATM (100 meters)</span>
                                </li>
                                <li>
                                    <span class="spec-label">Warranty</span>
                                    <span class="spec-value">5-Year International</span>
                                </li>
                            </ul>

                            <button class="btn-primary" onclick="addToCart(${watch.id})">Acquire Timepiece</button>
                        </div>
                    </div>
                `;
            } else {
                // If ID is missing or invalid, show an error state
                container.innerHTML = `
                    <div class="error-message">
                        <h2>Timepiece Not Found</h2>
                        <p class="text-muted" style="margin-bottom: 30px;">The requested model is currently unavailable or has been archived.</p>
                        <a href="collection.html" class="btn-primary" style="width: auto;">Return to Catalog</a>
                    </div>
                `;
            }

            // Mobile Menu Toggle
            const hamburger = document.getElementById('hamburger-menu');
            const navMenu = document.getElementById('nav-menu');
            if (hamburger && navMenu) {
                hamburger.addEventListener('click', () => navMenu.classList.toggle('active'));
            }
        });
    </script>
</body>
</html>
